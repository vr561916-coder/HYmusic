<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>HYmusic Peru2026</title>

    <meta name="description"
        content="HYmusic Peru2026 - Biblioteca musical online">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #121212;

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            padding-bottom: 110px;

        }


        /* =========================
           ENCABEZADO
        ========================= */

        header {

            background: #000;

            padding: 22px 30px;

            display: flex;

            align-items: center;

            gap: 10px;

            position: sticky;

            top: 0;

            z-index: 50;

        }


        .logo {

            font-size: 28px;

            font-weight: bold;

            color: #1ed760;

        }


        .logo-sub {

            font-size: 18px;

            color: #ddd;

        }


        /* =========================
           CONTENEDOR
        ========================= */

        .contenedor {

            max-width: 1100px;

            margin: auto;

            padding: 35px 25px;

        }


        h1 {

            font-size: 36px;

            margin-bottom: 25px;

        }


        /* =========================
           BUSCADOR
        ========================= */

        .buscador {

            margin-bottom: 30px;

        }


        .buscador input {

            width: 100%;

            max-width: 650px;

            padding: 16px 20px;

            border: none;

            border-radius: 30px;

            background: #242424;

            color: white;

            font-size: 16px;

            outline: none;

        }


        .buscador input:focus {

            background: #303030;

        }


        /* =========================
           GENEROS
        ========================= */

        .generos {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 18px;

            margin-top: 30px;

        }


        .genero {

            height: 150px;

            border: none;

            border-radius: 12px;

            color: white;

            text-align: left;

            padding: 22px;

            cursor: pointer;

            transition: 0.2s;

            font-size: 22px;

            font-weight: bold;

        }


        .genero:hover {

            transform: scale(1.03);

        }


        .rock {

            background:
                linear-gradient(
                    135deg,
                    #333,
                    #111
                );

        }


        .cumbia {

            background:
                linear-gradient(
                    135deg,
                    #8b4513,
                    #3d1f08
                );

        }


        .pop {

            background:
                linear-gradient(
                    135deg,
                    #7b1fa2,
                    #31104a
                );

        }


        .reggaeton {

            background:
                linear-gradient(
                    135deg,
                    #d35400,
                    #4a1d00
                );

        }


        .genero small {

            display: block;

            margin-top: 10px;

            font-size: 14px;

            color: #ddd;

            font-weight: normal;

        }


        /* =========================
           VISTA DE CANCIONES
        ========================= */

        #vistaCanciones {

            display: none;

        }


        .volver {

            background: #282828;

            border: none;

            color: white;

            padding: 11px 18px;

            border-radius: 20px;

            cursor: pointer;

            margin-bottom: 25px;

        }


        .volver:hover {

            background: #3a3a3a;

        }


        .titulo-genero {

            font-size: 30px;

            margin-bottom: 25px;

        }


        /* =========================
           CANCIONES
        ========================= */

        .cancion {

            display: flex;

            align-items: center;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 5px;

            transition: 0.2s;

        }


        .cancion:hover {

            background: #282828;

        }


        .numero {

            width: 40px;

            color: #888;

            text-align: center;

        }


        .icono-cancion {

            width: 50px;

            height: 50px;

            border-radius: 6px;

            background: #282828;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

            margin-right: 15px;

        }


        .informacion {

            flex: 1;

        }


        .nombre {

            font-size: 17px;

            font-weight: bold;

        }


        .artista {

            margin-top: 5px;

            color: #999;

            font-size: 14px;

        }


        /* BOTON PLAY */

        .play {

            width: 45px;

            height: 45px;

            border: none;

            border-radius: 50%;

            background: #1ed760;

            color: black;

            font-size: 18px;

            cursor: pointer;

            font-weight: bold;

        }


        .play:hover {

            transform: scale(1.08);

        }


        /* =========================
           RESULTADOS BUSCADOR
        ========================= */

        #resultadosBusqueda {

            display: none;

        }


        .titulo-busqueda {

            font-size: 25px;

            margin-bottom: 20px;

        }


        .sin-resultados {

            display: none;

            text-align: center;

            color: #888;

            padding: 50px;

        }


        /* =========================
           REPRODUCTOR INFERIOR
        ========================= */

        .player {

            position: fixed;

            bottom: 0;

            left: 0;

            right: 0;

            height: 90px;

            background: #181818;

            border-top: 1px solid #333;

            display: none;

            align-items: center;

            padding: 12px 25px;

            z-index: 100;

        }


        .player-info {

            width: 250px;

            min-width: 150px;

        }


        .player-title {

            font-weight: bold;

        }


        .player-artist {

            color: #999;

            font-size: 13px;

            margin-top: 5px;

        }


        .player audio {

            flex: 1;

            max-width: 700px;

            margin: auto;

        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 700px) {

            header {

                padding: 18px;

            }


            .contenedor {

                padding: 25px 15px;

            }


            h1 {

                font-size: 28px;

            }


            .generos {

                grid-template-columns: 1fr;

            }


            .genero {

                height: 120px;

            }


            .numero {

                display: none;

            }


            .player {

                height: 105px;

                flex-wrap: wrap;

                padding: 10px 15px;

            }


            .player-info {

                width: 100%;

                height: 35px;

            }


            .player audio {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     ENCABEZADO
========================= -->

<header>

    <div class="logo">
        🎵 HYmusic
    </div>

    <div class="logo-sub">
        Peru2026
    </div>

</header>


<div class="contenedor">


    <!-- =========================
         INICIO
    ========================= -->

    <div id="inicio">

        <h1>
            Tu biblioteca musical
        </h1>


        <!-- BUSCADOR -->

        <div class="buscador">

            <input
                type="text"
                id="busqueda"
                placeholder="🔎 Buscar canción o artista..."
            >

        </div>


        <!-- GENEROS -->

        <div class="generos">


            <button
                class="genero rock"
                onclick="abrirGenero('ROCK')">

                🎸 ROCK

                <small>
                    Ver canciones
                </small>

            </button>


            <button
                class="genero cumbia"
                onclick="abrirGenero('CUMBIA')">

                🪕 CUMBIA

                <small>
                    Ver canciones
                </small>

            </button>


            <button
                class="genero pop"
                onclick="abrirGenero('POP')">

                🎤 POP

                <small>
                    Ver canciones
                </small>

            </button>


            <button
                class="genero reggaeton"
                onclick="abrirGenero('REGGAETON')">

                🔥 REGGAETÓN

                <small>
                    Ver canciones
                </small>

            </button>


        </div>

    </div>



    <!-- =========================
         VISTA DE GENERO
    ========================= -->

    <div id="vistaCanciones">


        <button
            class="volver"
            onclick="volverInicio()">

            ← Volver

        </button>


        <h2
            class="titulo-genero"
            id="tituloGenero">

        </h2>


        <div id="listaCanciones">

        </div>


    </div>



    <!-- =========================
         RESULTADOS BUSQUEDA
    ========================= -->

    <div id="resultadosBusqueda">

        <h2 class="titulo-busqueda">
            Resultados de búsqueda
        </h2>


        <div id="listaResultados">

        </div>


        <div
            class="sin-resultados"
            id="sinResultados">

            😕 No se encontraron canciones.

        </div>

    </div>


</div>



<!-- =========================
     REPRODUCTOR INFERIOR
========================= -->

<div
    class="player"
    id="playerBox">


    <div class="player-info">

        <div
            class="player-title"
            id="playerTitle">

            Canción

        </div>


        <div
            class="player-artist"
            id="playerArtist">

            Artista

        </div>

    </div>


    <audio
        id="player"
        controls>

    </audio>


</div>



<script>


/* =========================
   BIBLIOTECA
========================= */

const canciones = [

    {
        titulo: "Apostemos",
        artista: "Grupo 5",
        genero: "CUMBIA",
        archivo: "APOSTEMOS-Grupo5(CUMBIA).mp3",
        icono: "🪕"
    },


    {
        titulo: "Billie Jean",
        artista: "Michael Jackson",
        genero: "POP",
        archivo: "BillieJean-MichaelJackson(POP).mp3",
        icono: "🎤"
    },


    {
        titulo: "We Will Rock You",
        artista: "Queen",
        genero: "ROCK",
        archivo: "WeWillRockYou-Queen(ROCK).mp3",
        icono: "🎸"
    }

];



/* =========================
   ABRIR GENERO
========================= */

function abrirGenero(genero) {


    document
        .getElementById("inicio")
        .style.display = "none";


    document
        .getElementById("resultadosBusqueda")
        .style.display = "none";


    document
        .getElementById("vistaCanciones")
        .style.display = "block";


    let titulo = "";


    if (genero === "ROCK") {

        titulo = "🎸 ROCK";

    }

    if (genero === "CUMBIA") {

        titulo = "🪕 CUMBIA";

    }

    if (genero === "POP") {

        titulo = "🎤 POP";

    }

    if (genero === "REGGAETON") {

        titulo = "🔥 REGGAETÓN";

    }


    document
        .getElementById("tituloGenero")
        .textContent = titulo;


    mostrarCanciones(genero);

}



/* =========================
   MOSTRAR CANCIONES
========================= */

function mostrarCanciones(genero) {


    const lista =
        document.getElementById("listaCanciones");


    lista.innerHTML = "";


    const filtradas =
        canciones.filter(function(cancion) {

            return cancion.genero === genero;

        });


    filtradas.forEach(function(cancion, indice) {


        const elemento =
            document.createElement("div");


        elemento.className = "cancion";


        elemento.innerHTML = `

            <div class="numero">
                ${indice + 1}
            </div>

            <div class="icono-cancion">
                ${cancion.icono}
            </div>

            <div class="informacion">

                <div class="nombre">
                    ${cancion.titulo}
                </div>

                <div class="artista">
                    ${cancion.artista}
                </div>

            </div>

            <button
                class="play"
                onclick="reproducirCancion(
                    '${cancion.titulo}',
                    '${cancion.artista}',
                    '${cancion.archivo}'
                )">

                ▶

            </button>

        `;


        lista.appendChild(elemento);

    });

}



/* =========================
   VOLVER
========================= */

function volverInicio() {


    document
        .getElementById("vistaCanciones")
        .style.display = "none";


    document
        .getElementById("resultadosBusqueda")
        .style.display = "none";


    document
        .getElementById("inicio")
        .style.display = "block";


    document
        .getElementById("busqueda")
        .value = "";

}



/* =========================
   REPRODUCIR
========================= */

function reproducirCancion(
    titulo,
    artista,
    archivo
) {


    const player =
        document.getElementById("player");


    player.src = archivo;


    document
        .getElementById("playerTitle")
        .textContent = titulo;


    document
        .getElementById("playerArtist")
        .textContent = artista;


    document
        .getElementById("playerBox")
        .style.display = "flex";


    player.play();

}



/* =========================
   BUSCADOR
========================= */

document
    .getElementById("busqueda")
    .addEventListener(
        "input",
        buscarCanciones
    );



function normalizar(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[\s\-_]/g, "");

}



function buscarCanciones() {


    const texto =
        document
        .getElementById("busqueda")
        .value
        .trim();


    if (texto === "") {


        document
            .getElementById("resultadosBusqueda")
            .style.display = "none";


        document
            .getElementById("inicio")
            .style.display = "block";


        return;

    }


    document
        .getElementById("inicio")
        .style.display = "none";


    document
        .getElementById("vistaCanciones")
        .style.display = "none";


    document
        .getElementById("resultadosBusqueda")
        .style.display = "block";


    const textoNormalizado =
        normalizar(texto);


    const resultados =
        canciones.filter(function(cancion) {


            const datos =
                normalizar(
                    cancion.titulo +
                    cancion.artista +
                    cancion.genero
                );


            return datos.includes(
                textoNormalizado
            );

        });


    const lista =
        document.getElementById(
            "listaResultados"
        );


    lista.innerHTML = "";


    resultados.forEach(function(cancion, indice) {


        const elemento =
            document.createElement("div");


        elemento.className = "cancion";


        elemento.innerHTML = `

            <div class="numero">
                ${indice + 1}
            </div>

            <div class="icono-cancion">
                ${cancion.icono}
            </div>

            <div class="informacion">

                <div class="nombre">
                    ${cancion.titulo}
                </div>

                <div class="artista">
                    ${cancion.artista}
                </div>

            </div>

            <button
                class="play"
                onclick="reproducirCancion(
                    '${cancion.titulo}',
                    '${cancion.artista}',
                    '${cancion.archivo}'
                )">

                ▶

            </button>

        `;


        lista.appendChild(elemento);

    });


    document
        .getElementById("sinResultados")
        .style.display =
        resultados.length === 0
        ? "block"
        : "none";

}


</script>


</body>

</html>

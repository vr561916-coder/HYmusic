<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HYmusic Peru2026 - Música online</title>

<meta name="description" content="HYmusic Peru2026 - Biblioteca de música online.">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
    padding-bottom: 120px;
}

/* =========================
   CABECERA
========================= */

header {
    text-align: center;
    padding: 35px 20px 20px;
}

header h1 {
    font-size: 42px;
    margin: 0 0 8px;
}

header p {
    color: #999;
}

/* =========================
   BUSCADOR
========================= */

.search {
    width: 90%;
    max-width: 600px;
    margin: 25px auto;
}

.search input {
    width: 100%;
    padding: 16px 22px;
    border: none;
    border-radius: 30px;
    background: #242424;
    color: white;
    font-size: 16px;
    outline: none;
}

.search input:focus {
    background: #303030;
}

/* =========================
   VISTAS
========================= */

.vista {
    display: none;
}

.vista.activa {
    display: block;
}

/* =========================
   GENEROS
========================= */

.generos {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

    gap: 20px;
}

.genero {
    background: #202020;
    border-radius: 18px;
    padding: 35px 20px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.genero:hover {
    background: #303030;
    transform: scale(1.03);
}

.icono {
    font-size: 45px;
}

.genero h2 {
    margin: 12px 0 5px;
}

.genero p {
    color: #999;
}

/* =========================
   CONTENIDO
========================= */

.contenido {
    max-width: 850px;
    margin: auto;
    padding: 20px;
}

/* =========================
   BOTON VOLVER
========================= */

.volver {
    background: #292929;
    color: white;
    border: none;

    padding: 12px 20px;

    border-radius: 25px;

    cursor: pointer;

    font-size: 15px;

    margin-bottom: 20px;
}

.volver:hover {
    background: #3a3a3a;
}

/* =========================
   CANCIONES
========================= */

.lista {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.cancion {
    background: #1f1f1f;

    padding: 15px 18px;

    border-radius: 10px;

    cursor: pointer;

    transition: 0.15s;
}

.cancion:hover {
    background: #303030;
}

.cancion.activa {
    background: #383838;
}

.titulo {
    font-size: 16px;
    font-weight: bold;
}

.artista {
    color: #999;
    font-size: 14px;
    margin-top: 5px;
}

.genero-tag {
    display: inline-block;

    margin-top: 8px;

    font-size: 11px;

    background: #333;

    padding: 4px 8px;

    border-radius: 10px;

    color: #bbb;
}

.vacio {
    text-align: center;
    color: #888;
    padding: 40px;
}

/* =========================
   REPRODUCTOR FIJO
========================= */

#reproductor {

    position: fixed;

    bottom: 0;
    left: 0;

    width: 100%;

    background: #181818;

    border-top: 1px solid #333;

    padding: 12px 20px;

    z-index: 99999;
}

#infoCancion {

    max-width: 900px;

    margin: 0 auto 7px;

    font-size: 14px;
}

.nombre {
    font-weight: bold;
}

.artistaActual {
    color: #999;
}

#audio {

    width: 100%;

    max-width: 900px;

    display: block;

    margin: auto;
}

/* =========================
   MOVIL
========================= */

@media(max-width:600px) {

    header h1 {
        font-size: 32px;
    }

    .generos {
        grid-template-columns: 1fr 1fr;
    }

    .genero {
        padding: 25px 10px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     CABECERA
===================================================== -->

<header>

    <h1>🎵 HYmusic Peru2026</h1>

    <p>Tu biblioteca de música</p>

    <div class="search">

        <input
            type="text"
            id="buscador"
            placeholder="🔎 Buscar canción o artista..."
            autocomplete="off"
        >

    </div>

</header>


<!-- =====================================================
     INICIO
===================================================== -->

<section id="inicio" class="vista activa">

    <div class="generos">

        <div class="genero" onclick="abrirGenero('POP')">

            <div class="icono">🎤</div>

            <h2>POP</h2>

            <p>Música pop</p>

        </div>


        <div class="genero" onclick="abrirGenero('ROCK')">

            <div class="icono">🎸</div>

            <h2>ROCK</h2>

            <p>Rock</p>

        </div>


        <div class="genero" onclick="abrirGenero('CUMBIA')">

            <div class="icono">💃</div>

            <h2>CUMBIA</h2>

            <p>Cumbia</p>

        </div>


        <div class="genero" onclick="abrirGenero('REGGAETON')">

            <div class="icono">🔥</div>

            <h2>REGGAETON</h2>

            <p>Reggaetón</p>

        </div>

    </div>

</section>


<!-- =====================================================
     BIBLIOTECA
===================================================== -->

<section id="biblioteca" class="vista">

    <div class="contenido">

        <button class="volver" onclick="volverInicio()">
            ← Volver
        </button>

        <h2 id="tituloGenero"></h2>

        <div id="listaCanciones" class="lista"></div>

    </div>

</section>


<!-- =====================================================
     BUSQUEDA
===================================================== -->

<section id="busqueda" class="vista">

    <div class="contenido">

        <button class="volver" onclick="volverInicio()">
            ← Volver
        </button>

        <h2>🔎 Resultados de búsqueda</h2>

        <div id="listaBusqueda" class="lista"></div>

    </div>

</section>


<!-- =====================================================
     REPRODUCTOR PERMANENTE
     
     IMPORTANTE:
     Este reproductor NO está dentro de ninguna vista.
     Por eso NO desaparece ni se reinicia.
===================================================== -->

<div id="reproductor">

    <div id="infoCancion">

        🎵 Ninguna canción seleccionada

    </div>

    <audio id="audio" controls></audio>

</div>


<script>


/* =====================================================
   CANCIONES
===================================================== */

const canciones = [

    "Amigo-Grupo5(CUMBIA).mp3",

    /* POP */

    "Bad-MichaelJackson(POP).mp3",

    "LEAVEMEALONE-MichaelJackson(POP).mp3",
    "RememberTheTime-MichaelJackson(POP).mp3",
    "SmoothCriminal-MichaelJackson(POP).mp3",
    "TheDontCareAboutUs-MichaelJackson(POP).mp3",
    "TheWayYouMakeMeFeel-MichaelJackson(POP).mp3",
    "Triller-MichaelJackson(POP).mp3",
    "WannaBeStartinSomethin-MichaelJackson(POP).mp3",


    /* ROCK */

    "BohemianRapshody-Queen(ROCK).mp3",
    "DontStopMeNow-Queen(ROCK).mp3",
    "EnterSandman-Metalica(ROCK).mp3",
    "IWasMadeForLovinYou-Kiss(ROCK).mp3",
    "LoveOfMyLife-Queen(ROCK).mp3",
    "LoveWitchMyCar-Queen(ROCK).mp3",
    "PsychoCircus-Kiss(ROCK).mp3",
    "SweetChildOMine-GunsNRoses(ROCK).mp3",
    "WeWillRockYou-Queen(ROCK).mp3",
    "WelcomeToTheJungle-GunsNRoses(ROCK).mp3",


    /* REGGAETON */

    "Abusadora-WisinyYandel(REGGAETON).mp3",
    "Ayer-ANUEL(REGGAETON).mp3",
    "BaileInolvidable-BADBUNNY(REGGAETON).mp3",
    "Bellaqueo-Ozuna(REGGAETON).mp3",
    "CafeConRon-BADBUNNY(REGGAETON).mp3",
    "Efecto-BADBUNNY(REGGAETON).mp3",
    "Golie-NickyJam(REGGAETON).mp3",
    "GuayaGuaya-DonOmar(REGGAETON).mp3",
    "HolaRemix-Dalex(REGGAETON).mp3",
    "KetuTecre-BADBUNNY(REGGAETON).mp3",
    "LaFoto-NickyJam(REGGAETON).mp3",
    "LaOcasion-ANUEL(REGGAETON).mp3",
    "LaUltimaVez-ANUEL(REGGAETON).mp3",
    "MeEstasTentando-WisinyYandel(REGGAETON).mp3",
    "MeFuiDeVacaciones-BADBUNNY(REGGAETON).mp3",
    "MePortoBonito-BADBUNNY(REGGAETON).mp3",
    "MoscowMule-BADBUNNY(REGGAETON).mp3",
    "NoQuiereEnamorarse-Ozuna(REGGAETON).mp3",
    "PiensasEnMi-NickyJam(REGGAETON).mp3",
    "SexyMovimiento-WisinyYandel(REGGAETON).mp3",
    "SiNoSupisteQuererme-Ozuna(REGGAETON).mp3",
    "SoyGuapo-FaraonLoveShady(REGGAETON).mp3",
    "TuNoLoAmas-ANUEL(REGGAETON).mp3",
    "Turista-BADBUNNY(REGGAETON).mp3",
    "UnaAventura-Ozuna(REGGAETON).mp3",
    "Weltita-BADBUNNY(REGGAETON).mp3",
    "YaNoTeEspero-Ozuna(REGGAETON).mp3"

];


/* =====================================================
   ESTADO DEL REPRODUCTOR
===================================================== */

let cancionActual = null;


/* =====================================================
   OBTENER GENERO
===================================================== */

function obtenerGenero(archivo) {

    const resultado = archivo.match(/\((.*?)\)/);

    if (resultado) {

        return resultado[1].toUpperCase();

    }

    return "OTROS";
}


/* =====================================================
   OBTENER NOMBRE Y ARTISTA
===================================================== */

function obtenerDatos(archivo) {

    let limpio = archivo.replace(".mp3", "");

    let genero = obtenerGenero(archivo);

    limpio = limpio.replace(/\(.*?\)/, "");

    let partes = limpio.split("-");

    let titulo = partes[0] || limpio;

    let artista = partes.slice(1).join("-") || "Artista desconocido";

    return {
        titulo: formatearTexto(titulo),
        artista: formatearTexto(artista),
        genero: genero
    };

}


/* =====================================================
   FORMATEAR NOMBRES
===================================================== */

function formatearTexto(texto) {

    return texto
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/_/g, " ")
        .replace(/-/g, " ")
        .trim();

}


/* =====================================================
   ABRIR GENERO
===================================================== */

function abrirGenero(genero) {

    document.getElementById("inicio")
        .classList.remove("activa");

    document.getElementById("busqueda")
        .classList.remove("activa");

    document.getElementById("biblioteca")
        .classList.add("activa");


    document.getElementById("tituloGenero").textContent =
        obtenerIcono(genero) + " " + genero;


    const resultados = canciones.filter(cancion =>
        obtenerGenero(cancion) === genero
    );


    mostrarCanciones(
        resultados,
        "listaCanciones"
    );

}


/* =====================================================
   ICONOS
===================================================== */

function obtenerIcono(genero) {

    if (genero === "POP") return "🎤";

    if (genero === "ROCK") return "🎸";

    if (genero === "CUMBIA") return "💃";

    if (genero === "REGGAETON") return "🔥";

    return "🎵";

}


/* =====================================================
   MOSTRAR CANCIONES
===================================================== */

function mostrarCanciones(lista, contenedor) {

    const elemento =
        document.getElementById(contenedor);

    elemento.innerHTML = "";


    if (lista.length === 0) {

        elemento.innerHTML =
            '<div class="vacio">No se encontraron canciones.</div>';

        return;
    }


    lista.forEach(archivo => {

        const datos = obtenerDatos(archivo);


        const div =
            document.createElement("div");

        div.className = "cancion";


        /*
         * Si esta canción está sonando,
         * mantenerla marcada aunque cambiemos de vista.
         */

        if (cancionActual === archivo) {

            div.classList.add("activa");

        }


        div.innerHTML = `

            <div class="titulo">
                🎵 ${datos.titulo}
            </div>

            <div class="artista">
                ${datos.artista}
            </div>

            <span class="genero-tag">
                ${datos.genero}
            </span>

        `;


        div.onclick = function() {

            reproducir(archivo);

            /*
             * Actualizar visualmente
             * la canción seleccionada.
             */

            document
                .querySelectorAll(".cancion")
                .forEach(x =>
                    x.classList.remove("activa")
                );

            div.classList.add("activa");

        };


        elemento.appendChild(div);

    });

}


/* =====================================================
   REPRODUCIR
===================================================== */

function reproducir(archivo) {

    const audio =
        document.getElementById("audio");


    /*
     * Si seleccionamos la misma canción
     * que ya está sonando,
     * NO la reiniciamos.
     */

    if (cancionActual === archivo) {

        if (audio.paused) {

            audio.play();

        }

        return;

    }


    /*
     * Solo aquí cambiamos la canción.
     */

    cancionActual = archivo;


    audio.src =
        encodeURI(archivo);


    audio.play();


    actualizarInfo(archivo);

}


/* =====================================================
   INFORMACION DEL REPRODUCTOR
===================================================== */

function actualizarInfo(archivo) {

    const datos =
        obtenerDatos(archivo);


    document.getElementById("infoCancion").innerHTML = `

        <span class="nombre">
            🎵 ${datos.titulo}
        </span>

        <span class="artistaActual">
            — ${datos.artista}
        </span>

    `;

}


/* =====================================================
   VOLVER AL INICIO
===================================================== */

function volverInicio() {

    /*
     * MUY IMPORTANTE:
     *
     * NO hacemos:
     *
     * audio.pause()
     * audio.src = ""
     * audio.load()
     *
     * Por eso la música continúa.
     */


    document
        .getElementById("biblioteca")
        .classList.remove("activa");


    document
        .getElementById("busqueda")
        .classList.remove("activa");


    document
        .getElementById("inicio")
        .classList.add("activa");

}


/* =====================================================
   BUSCADOR
===================================================== */

const buscador =
    document.getElementById("buscador");


buscador.addEventListener("input", function() {

    const texto = buscador.value
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, "");


    /*
     * Si el buscador está vacío,
     * volver al inicio.
     */

    if (texto === "") {

        document
            .getElementById("busqueda")
            .classList.remove("activa");

        document
            .getElementById("biblioteca")
            .classList.remove("activa");

        document
            .getElementById("inicio")
            .classList.add("activa");

        return;

    }


    document
        .getElementById("inicio")
        .classList.remove("activa");


    document
        .getElementById("biblioteca")
        .classList.remove("activa");


    document
        .getElementById("busqueda")
        .classList.add("activa");


    const resultados =
        canciones.filter(archivo => {

            const datos =
                obtenerDatos(archivo);


            const titulo =
                datos.titulo
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/\s+/g, "");


            const artista =
                datos.artista
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/\s+/g, "");


            return titulo.includes(texto) ||
                   artista.includes(texto);

        });


    mostrarCanciones(
        resultados,
        "listaBusqueda"
    );

});


</script>

</body>
</html>

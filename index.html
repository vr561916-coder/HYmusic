<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="msvalidate.01" content="424E94A3319A011D09BAB3137C3E9FCF">

    <title>HYmusic Peru2026 - Biblioteca Musical</title>

    <meta name="description"
        content="HYmusic Peru2026 - Biblioteca musical online organizada por géneros.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 35px 20px 20px;
            text-align: center;
            background: linear-gradient(180deg, #171717, #0b0b0b);
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            color: #aaa;
            margin-top: 8px;
        }

        .buscador {
            max-width: 650px;
            margin: 25px auto 10px;
            padding: 0 20px;
        }

        .buscador input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 30px;
            background: #242424;
            color: white;
            font-size: 17px;
            outline: none;
        }

        .buscador input:focus {
            background: #303030;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        /* =========================
           GENEROS
        ========================= */

        #generos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .genero {
            min-height: 150px;
            padding: 25px;
            border-radius: 18px;
            background: linear-gradient(145deg, #202020, #151515);
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #292929;
        }

        .genero:hover {
            transform: translateY(-4px);
            background: #282828;
        }

        .genero .icono {
            font-size: 45px;
        }

        .genero h2 {
            margin: 10px 0 5px;
        }

        .genero p {
            color: #999;
            margin: 0;
        }

        /* =========================
           PAGINA DEL GENERO
        ========================= */

        #biblioteca {
            display: none;
        }

        .barra-superior {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .volver {
            border: none;
            background: #242424;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
        }

        .volver:hover {
            background: #333;
        }

        .titulo-genero {
            font-size: 30px;
            margin: 0;
        }

        #listaCanciones {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cancion {
            background: #181818;
            border-radius: 12px;
            padding: 15px;
            transition: 0.2s;
        }

        .cancion:hover {
            background: #242424;
        }

        .datos-cancion {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .numero {
            color: #777;
            width: 30px;
            text-align: center;
        }

        .icono-cancion {
            font-size: 28px;
        }

        .info {
            flex: 1;
            min-width: 0;
        }

        .titulo {
            font-size: 17px;
            font-weight: bold;
        }

        .artista {
            color: #999;
            margin-top: 4px;
            font-size: 14px;
        }

        .tag {
            display: inline-block;
            margin-top: 7px;
            padding: 4px 9px;
            border-radius: 20px;
            background: #303030;
            color: #bbb;
            font-size: 11px;
        }

        audio {
            width: 100%;
            margin-top: 12px;
        }

        /* =========================
           RESULTADOS DE BUSQUEDA
        ========================= */

        #resultados {
            display: none;
            margin-top: 30px;
        }

        .resultado-titulo {
            color: #aaa;
            margin-bottom: 15px;
        }

        .sin-resultados {
            text-align: center;
            color: #777;
            padding: 40px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 32px;
            }

            main {
                padding: 15px;
            }

            .genero {
                min-height: 130px;
            }

            .datos-cancion {
                gap: 8px;
            }

            .numero {
                width: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🎵 HYmusic Peru2026</h1>

    <p>Tu biblioteca musical</p>

    <div class="buscador">
        <input
            type="text"
            id="busqueda"
            placeholder="🔎 Buscar canción o artista..."
            autocomplete="off"
        >
    </div>

</header>


<main>

    <!-- =========================
         MENU PRINCIPAL
    ========================== -->

    <section id="inicio">

        <h2>Biblioteca</h2>

        <div id="generos"></div>

    </section>


    <!-- =========================
         RESULTADOS BUSQUEDA
    ========================== -->

    <section id="resultados">

        <h2 class="resultado-titulo">
            Resultados de búsqueda
        </h2>

        <div id="listaResultados"></div>

    </section>


    <!-- =========================
         BIBLIOTECA DEL GENERO
    ========================== -->

    <section id="biblioteca">

        <div class="barra-superior">

            <button
                class="volver"
                onclick="volverInicio()"
                title="Volver"
            >
                ←
            </button>

            <h2
                class="titulo-genero"
                id="nombreGenero"
            >
            </h2>

        </div>

        <div id="listaCanciones"></div>

    </section>

</main>


<script>

/* =====================================================

const archivos = [

    "BaileInolvidable-BADBUNNY(REGGAETON).mp3",

    "Bellaqueo-Ozuna(REGGAETON).mp3",
    "BillieJean-MichaelJackson(POP).mp3",
    "BloodOnTheDanceFloor-MichaelJackson(POP).mp3",
    "BohemianRapshody-Queen(ROCK).mp3",
    "CafeConRon-BADBUNNY(REGGAETON).mp3",
    "CarelesWisper-GeorgeMichael(POP).mp3",
    "Dangerous-MichaelJackson(POP).mp3",
    "DesdeQueTeVi-CorazonSerrano(CUMBIA).mp3",
    "DontStopMeNow-Queen(ROCK).mp3",
    "DontStopTilYouGetEnough-MichaelJackson(POP).mp3",
    "Efecto-BADBUNNY(REGGAETON).mp3",
    "ElRitmoDeMiCorazon-Grupo5(CUMBIA).mp3",
    "EnterSandman-Metalica(ROCK).mp3",
    "EseAmargoAmor-CHACALON(CUMBIA).mp3",

    "LaCulebritica-Grupo5(CUMBIA).mp3",
    "LaFoto-NickyJam(REGGAETON).mp3",
    "LaOcasion-ANUEL(REGGAETON).mp3",

    "PiensasEnMi-NickyJam(REGGAETON).mp3",

    "RememberTheTime-MichaelJackson(POP).mp3",
    "SexyMovimiento-WisinyYandel(REGGAETON).mp3",
    "SiNoSupisteQuererme-Ozuna(REGGAETON).mp3",
    "SmoothCriminal-MichaelJackson(POP).mp3",
    "SoyGuapo-FaraonLoveShady(REGGAETON).mp3",
    "SweetChildOMine-GunsNRoses(ROCK).mp3",
    "TeVas-Grupo5(CUMBIA).mp3",
    "TheDontCareAboutUs-MichaelJackson(POP).mp3",
    "TheWayYouMakeMeFeel-MichaelJackson(POP).mp3",
    "Triller-MichaelJackson(POP).mp3",
    "TuNoLoAmas-ANUEL(REGGAETON).mp3",
    "Turista-BADBUNNY(REGGAETON).mp3",
    "UnaAventura-Ozuna(REGGAETON).mp3",
    "VenMiAmor-CHACALON(CUMBIA).mp3",
    "WannaBeStartinSomethin-MichaelJackson(POP).mp3",
    "WeWillRockYou-Queen(ROCK).mp3",
    "WelcomeToTheJungle-GunsNRoses(ROCK).mp3",
    "Weltita-BADBUNNY(REGGAETON).mp3",
    "YaNoTeEspero-Ozuna(REGGAETON).mp3"

];


/* =====================================================
   CONVERTIR LOS NOMBRES DE ARCHIVO EN DATOS
   ===================================================== */

function crearCancion(archivo) {

    let nombre = archivo.replace(".mp3", "");

    let partes = nombre.match(/^(.+)-(.+)\(([^)]+)\)$/);

    if (!partes) {
        return null;
    }

    let titulo = partes[1];
    let artista = partes[2];
    let genero = partes[3].toUpperCase();

    return {
        archivo: archivo,
        titulo: titulo,
        artista: artista,
        genero: genero
    };
}


const canciones = archivos
    .map(crearCancion)
    .filter(cancion => cancion !== null);


/* =====================================================
   ICONOS
   ===================================================== */

function obtenerIcono(genero) {

    if (genero === "ROCK") {
        return "🎸";
    }

    if (genero === "CUMBIA") {
        return "🪕";
    }

    if (genero === "POP") {
        return "🎤";
    }

    if (genero === "REGGAETON") {
        return "🔥";
    }

    return "🎵";
}


/* =====================================================
   NOMBRES BONITOS
   ===================================================== */

function nombreBonito(texto) {

    const nombres = {
        "CUMBIA": "Cumbia",
        "POP": "Pop",
        "ROCK": "Rock",
        "REGGAETON": "Reguetón"
    };

    return nombres[texto] || texto;
}


/* =====================================================
   NORMALIZAR TEXTO PARA BUSQUEDA
   ===================================================== */

function normalizar(texto) {

    return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9]/g, "")
        .toLowerCase();
}


/* =====================================================
   CREAR MENU DE GENEROS
   ===================================================== */

function crearGeneros() {

    const contenedor = document.getElementById("generos");

    const orden = [
        "REGGAETON",
        "CUMBIA",
        "POP",
        "ROCK"
    ];

    orden.forEach(genero => {

        const cantidad = canciones.filter(
            cancion => cancion.genero === genero
        ).length;

        if (cantidad === 0) return;

        const div = document.createElement("div");

        div.className = "genero";

        div.onclick = function() {
            abrirGenero(genero);
        };

        div.innerHTML = `
            <div class="icono">
                ${obtenerIcono(genero)}
            </div>

            <h2>${nombreBonito(genero)}</h2>

            <p>${cantidad} canciones</p>
        `;

        contenedor.appendChild(div);

    });
}


/* =====================================================
   CREAR UNA CANCION
   ===================================================== */

function crearElementoCancion(cancion, numero) {

    const div = document.createElement("div");

    div.className = "cancion";

    div.innerHTML = `

        <div class="datos-cancion">

            <div class="numero">
                ${numero}
            </div>

            <div class="icono-cancion">
                ${obtenerIcono(cancion.genero)}
            </div>

            <div class="info">

                <div class="titulo">
                    ${cancion.titulo}
                </div>

                <div class="artista">
                    ${cancion.artista}
                </div>

                <span class="tag">
                    ${nombreBonito(cancion.genero)}
                </span>

            </div>

        </div>

        <audio controls preload="none">

            <source
                src="${encodeURI(cancion.archivo)}"
                type="audio/mpeg"
            >

            Tu navegador no puede reproducir este audio.

        </audio>
    `;

    return div;
}


/* =====================================================
   ABRIR GENERO
   ===================================================== */

function abrirGenero(genero) {

    document.getElementById("inicio").style.display = "none";

    document.getElementById("resultados").style.display = "none";

    document.getElementById("biblioteca").style.display = "block";

    document.getElementById("busqueda").value = "";

    document.getElementById("nombreGenero").textContent =
        obtenerIcono(genero) + " " + nombreBonito(genero);

    const lista = document.getElementById("listaCanciones");

    lista.innerHTML = "";

    const cancionesGenero = canciones.filter(
        cancion => cancion.genero === genero
    );

    cancionesGenero.forEach((cancion, index) => {

        lista.appendChild(
            crearElementoCancion(cancion, index + 1)
        );

    });

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =====================================================
   VOLVER AL MENU PRINCIPAL
   ===================================================== */

function volverInicio() {

    document.getElementById("biblioteca").style.display = "none";

    document.getElementById("resultados").style.display = "none";

    document.getElementById("inicio").style.display = "block";

    document.getElementById("busqueda").value = "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =====================================================
   BUSCADOR
   ===================================================== */

const buscador = document.getElementById("busqueda");

buscador.addEventListener("input", function() {

    const texto = normalizar(this.value.trim());

    const inicio = document.getElementById("inicio");
    const biblioteca = document.getElementById("biblioteca");
    const resultados = document.getElementById("resultados");
    const lista = document.getElementById("listaResultados");

    if (texto === "") {

        resultados.style.display = "none";

        if (biblioteca.style.display !== "block") {
            inicio.style.display = "block";
        }

        return;
    }

    inicio.style.display = "none";
    biblioteca.style.display = "none";
    resultados.style.display = "block";

    lista.innerHTML = "";

    const encontrados = canciones.filter(cancion => {

        const titulo = normalizar(cancion.titulo);
        const artista = normalizar(cancion.artista);

        return (
            titulo.includes(texto) ||
            artista.includes(texto)
        );

    });


    if (encontrados.length === 0) {

        lista.innerHTML = `
            <div class="sin-resultados">
                😕 No encontramos ninguna canción.
            </div>
        `;

        return;
    }


    encontrados.forEach((cancion, index) => {

        lista.appendChild(
            crearElementoCancion(cancion, index + 1)
        );

    });

});


/* =====================================================
   INICIAR
   ===================================================== */

crearGeneros();

</script>

</body>
</html>
